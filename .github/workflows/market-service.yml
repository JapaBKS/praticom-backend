# Testa e publica o microsserviço Mercadinho (MongoDB) no Azure Web App (App Service, Node 20, Linux).
# Configure no GitHub: Settings > Secrets and variables > Actions
#   secret   AZURE_MARKET_PUBLISH_PROFILE  (Web App > Visão geral > Baixar perfil de publicação)
#   variable AZURE_MARKET_WEBAPP_NAME      (nome do Web App, ex.: praticom-market)
# Sem o secret do perfil de publicação, o workflow só roda os testes.
name: Deploy market-service (Azure Web App)

on:
  push:
    branches: [main]
    paths: ['market-service/**', '.github/workflows/market-service.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: market-service

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      HAS_PROFILE: ${{ secrets.AZURE_MARKET_PUBLISH_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: market-service/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm prune --omit=dev
      - uses: azure/webapps-deploy@v3
        if: env.HAS_PROFILE == 'true'
        with:
          app-name: ${{ vars.AZURE_MARKET_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_MARKET_PUBLISH_PROFILE }}
          package: market-service
